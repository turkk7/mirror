; برنامج طبقة اللمس الافتراضية — ESP32-S3 + حسّاسَي VL53L1X (ToF).
; يقرأ المسافتين الخام من حسّاسين على ناقل I2C مشترك ويرسلهما عبر السيريال (Web Serial).
; أفضل ممارسة: إصدارات المكتبات مثبّتة هنا حتى يكون البناء قابلاً للتكرار على أي جهاز.
;
; البناء/الرفع:  pio run -t upload        المراقبة:  pio device monitor -b 115200

; إعدادات مشتركة لكل البيئات.
[common]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; (متصل عبر جسر UART خارجي CH343 → Serial على UART0 الافتراضي، بلا إعدادات USB-CDC.)
; مكتبة SparkFun — مختارة لأنها تكشف setROI() (تضييق مجال الرؤية ~15°)،
; وهو مطلب تصميمي لمعالجة تداخل الساعد على محور X. مكتبة Pololu لا تدعم ROI.
lib_deps =
    sparkfun/SparkFun VL53L1X 4m Laser Distance Sensor@^1.2.12

; برنامج الإنتاج: حسّاس واحد (الخطة الحالية). الرفع:  pio run -t upload
[env:esp32-s3]
extends = common
build_src_filter = +<single_main.cpp>

; كود الحسّاسَين القديم (تثليث X,Y) — محفوظ للرجوع. الرفع:  pio run -e dual -t upload
[env:dual]
extends = common
build_src_filter = +<main.cpp>

; ماسح I2C للتشخيص. الرفع:  pio run -e scan -t upload
[env:scan]
extends = common
build_src_filter = +<i2c_scan.cpp>

; اختبار أطراف (بدون I2C). الرفع:  pio run -e diag -t upload
[env:diag]
extends = common
build_src_filter = +<pin_diag.cpp>

; برنامج اختبار حسّاس واحد. الرفع:  pio run -e test-single -t upload
[env:test-single]
extends = common
build_src_filter = +<single_sensor.cpp>
