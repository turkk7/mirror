<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>قمرا — لا توجد صورة بعد</title>
    <meta name="theme-color" content="#0b0c12" />
    <link rel="icon" type="image/png" href="/assets/brand/favicon-48.png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <style>
      :root {
        --ink: #0b0c12; --cream: #f1ece1; --muted: #938e85; --gold: #c9a86a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        font-family: "Tajawal", -apple-system, "Segoe UI", system-ui, sans-serif;
        font-weight: 300;
        background:
          radial-gradient(80vmax 60vmax at 80% -10%, rgba(201,168,106,0.14), transparent 60%),
          radial-gradient(80vmax 60vmax at -10% 110%, rgba(96,116,158,0.16), transparent 60%),
          var(--ink);
        color: var(--cream);
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
        text-align: center;
      }
      .mark { width: 92px; height: 92px; object-fit: contain; opacity: 0.95; }
      h1 { font-size: 1.4rem; font-weight: 500; letter-spacing: 0.03em; }
      .hint { font-size: 1rem; color: var(--muted); max-width: 330px; line-height: 1.85; }
      .accent { color: var(--gold); }
    </style>
  </head>
  <body>
    <img class="mark" src="/assets/brand/mark-cream.png" alt="قمرا" />
    <h1>لا توجد صورة بعد</h1>
    <p class="hint">
      التقط صورتك أولاً من <span class="accent">المرآة</span>، ثم المس هذا الستيكر
      بجوالك لتظهر صورتك هنا مباشرة.
    </p>
  </body>
</html>
